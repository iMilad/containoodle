name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked build tools
        run: npm ci --ignore-scripts

      - name: Audit runtime and build dependencies
        run: npm run audit:dependencies

      - name: Verify tag matches manifest version
        id: version
        run: |
          set -euo pipefail
          manifest_ver="$(node -e "console.log(require('./firefox-extension/manifest.json').version)")"
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "manifest=$manifest_ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag_ver" >> "$GITHUB_OUTPUT"
          if [ "$manifest_ver" != "$tag_ver" ]; then
            echo "::error::Tag v$tag_ver does not match manifest.json version $manifest_ver"
            exit 1
          fi
          echo "Releasing Containoodle v$tag_ver"

      - name: Build and verify reproducible XPI
        run: npm run build:ext

      - name: Publish the tagged privacy disclosure to the existing AMO listing
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/sync-amo-privacy.mjs --publish

      # Submit the same tagged version to the existing public AMO listing.
      # AMO performs validation and review; listed releases are installed
      # and updated through addons.mozilla.org rather than a GitHub XPI.
      - name: Submit listed version to AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$AMO_JWT_ISSUER" || -z "$AMO_JWT_SECRET" ]]; then
            echo "::error::AMO signing secrets are required for an automated listed release."
            exit 1
          fi
          node --require ./scripts/lint-image-guard.cjs ./node_modules/web-ext/bin/web-ext.js sign \
            --source-dir=firefox-extension \
            --channel=listed \
            --approval-timeout=0 \
            --no-input \
            --no-config-discovery \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Containoodle v${{ steps.version.outputs.tag }}
          files: artifacts/containoodle-${{ steps.version.outputs.tag }}.xpi
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ### Containoodle v${{ steps.version.outputs.tag }}

            This version was submitted automatically to the public
            [Firefox Add-ons listing](https://addons.mozilla.org/firefox/addon/containoodle/).
            Mozilla review status is managed on AMO.

            The attached unsigned XPI is for temporary testing through `about:debugging`
            in an isolated test profile. Keep your main profile and Firefox signature
            settings unchanged; install normal releases through AMO.
