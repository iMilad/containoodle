name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked build tools
        run: npm ci --ignore-scripts

      - name: Confirm no runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Verify tag matches manifest version
        id: version
        run: |
          set -euo pipefail
          manifest_ver="$(node -e "console.log(require('./firefox-extension/manifest.json').version)")"
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "manifest=$manifest_ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag_ver" >> "$GITHUB_OUTPUT"
          if [ "$manifest_ver" != "$tag_ver" ]; then
            echo "::error::Tag v$tag_ver does not match manifest.json version $manifest_ver"
            exit 1
          fi
          echo "Releasing Orbiting Turnip v$tag_ver"

      - name: Test and lint release source
        run: |
          python3 -m py_compile server.py
          npm test
          npm run lint:ext

      - name: Build and verify reproducible XPI
        run: npm run build:ext

      # Runs only once the AMO_JWT_ISSUER / AMO_JWT_SECRET repo secrets
      # exist (Developer Hub → Manage API Keys). Signs on the unlisted
      # (self-distribution) channel; the signed XPI installs on regular
      # Firefox with no about:config changes.
      - name: Sign XPI with AMO (skipped until secrets are configured)
        env:
          TAG: ${{ steps.version.outputs.tag }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$AMO_JWT_ISSUER" || -z "$AMO_JWT_SECRET" ]]; then
            echo "AMO signing secrets are not configured; unsigned artifact only."
            exit 0
          fi
          ./node_modules/.bin/web-ext sign \
            --source-dir=firefox-extension \
            --channel=unlisted \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --artifacts-dir=signed
          mv signed/*.xpi "artifacts/orbiting-turnip-${TAG}-signed.xpi"
          echo "Signed: artifacts/orbiting-turnip-${TAG}-signed.xpi"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Orbiting Turnip v${{ steps.version.outputs.tag }}
          files: artifacts/*.xpi
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ### Orbiting Turnip v${{ steps.version.outputs.tag }}

            Prefer `orbiting-turnip-…-signed.xpi` when present — it installs permanently on regular Firefox.
            The unsigned `orbiting-turnip-….xpi` needs `about:debugging` (temporary) or a Developer/Nightly
            build with `xpinstall.signatures.required = false`.
